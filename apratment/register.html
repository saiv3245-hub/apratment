<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <main class="login-page">
        <section class="login-cover">
            <img src="image/register.png" alt="รูปหอพัก">

            <div class="cover-content">
                <h1>ระบบหอพัก</h1>
                <p>ระบบจัดการหอพัก</p>
            </div>
        </section>

        <section class="login-content">
            <div class="login-box">
                <h2 class="login-title">สมัครสมาชิก</h2>

                <p class="login-subtitle">
                    กรอกข้อมูลเพื่อสร้างบัญชีผู้ใช้งาน
                </p>

                <div id="registerMessage"
                     class="alert d-none"
                     role="alert">
                </div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            ชื่อผู้ใช้
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-badge"></i>
                            </span>

                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   placeholder="กรอกชื่อผู้ใช้"
                                   minlength="3"
                                   maxlength="100"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label">
                            ชื่อ-นามสกุล
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text"
                                   id="fullName"
                                   name="full_name"
                                   class="form-control"
                                   placeholder="ชื่อ-นามสกุล"
                                   maxlength="200"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            อีเมล
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="example@email.com"
                                   maxlength="150"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            เบอร์โทรศัพท์
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-telephone"></i>
                            </span>

                            <input type="tel"
                                   id="phone"
                                   name="phone"
                                   class="form-control"
                                   placeholder="เช่น 0812345678"
                                   maxlength="10"
                                   pattern="[0-9]{10}"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            รหัสผ่าน
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="กรอกรหัสผ่านอย่างน้อย 6 ตัว"
                                   minlength="6"
                                   maxlength="128"
                                   required>

                            <button type="button"
                                    id="toggleRegisterPassword"
                                    class="btn btn-outline-secondary password-button"
                                    aria-label="แสดงหรือซ่อนรหัสผ่าน">

                                <i id="registerPasswordIcon"
                                   class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">
                            ยืนยันรหัสผ่าน
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <input type="password"
                                   id="confirmPassword"
                                   name="confirm_password"
                                   class="form-control"
                                   placeholder="กรอกรหัสผ่านอีกครั้ง"
                                   minlength="6"
                                   maxlength="128"
                                   required>

                            <button type="button"
                                    id="toggleConfirmPassword"
                                    class="btn btn-outline-secondary password-button"
                                    aria-label="แสดงหรือซ่อนยืนยันรหัสผ่าน">

                                <i id="confirmPasswordIcon"
                                   class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 login-button">
                        สร้างบัญชี
                    </button>
                </form>

                <div class="register-text">
                    <span>มีบัญชีอยู่แล้ว?</span>
                    <a href="login.html">เข้าสู่ระบบ</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
